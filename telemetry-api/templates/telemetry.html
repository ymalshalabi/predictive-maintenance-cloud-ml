<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Metrics Telemetry with Infinite Scroll</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            margin: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 300;
            border-bottom: 2px solid #0d6efd;
            display: inline-block;
            padding-bottom: 10px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            height: 100%;
        }
        .chart-card:hover {
            transform: translateY(-5px);
        }
        .chart-title {
            font-size: 1rem;
            font-weight: 500;
            color: #495057;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .chart-title i {
            margin-right: 6px;
            color: #0d6efd;
        }
        canvas {
            max-height: 200px;
            width: 100% !important;
        }
        .sortable { cursor: pointer; text-decoration: underline; }
        .sortable:hover { color: #0d6efd; }
        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }
        .table thead {
            background-color: #343a40;
            color: white;
        }
        .filter-section {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .loading-spinner {
            text-align: center;
            padding: 10px;
            display: none;
        }
        .loading-spinner.visible {
            display: block;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chart-line" style="margin-right: 10px;"></i>System Metrics Dashboard</h1>

        <!-- 2x2 Charts Grid -->
        <div class="row g-3">
            <div class="col-md-6">
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-microchip"></i> CPU %
                    </div>
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-memory"></i> Memory %
                    </div>
                    <canvas id="memChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-hdd"></i> Disk I/O %
                    </div>
                    <canvas id="diskChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-network-wired"></i> Network I/O (B/s)
                    </div>
                    <canvas id="networkChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Search / Filter Section -->
        <div class="filter-section mt-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search (e.g. cpu, memory values)">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary" id="applyFilter"><i class="fas fa-search"></i> Apply Filter</button>
                </div>
                <div class="col-md-6 text-end text-muted">
                    <i class="fas fa-sync-alt"></i> Auto‑updates every 10 seconds
                </div>
            </div>
        </div>

        <!-- Metrics Table with Infinite Scroll -->
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th class="sortable" data-sort="timestamp">Timestamp</th>
                    <th class="sortable" data-sort="cpu_util_percent">CPU %</th>
                    <th class="sortable" data-sort="mem_util_percent">Memory %</th>
                    <th class="sortable" data-sort="net_in">Net In (B/s)</th>
                    <th class="sortable" data-sort="net_out">Net Out (B/s)</th>
                    <th class="sortable" data-sort="disk_io_percent">Disk I/O %</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- rows inserted dynamically -->
            </tbody>
        </table>

        <!-- Loading indicator for infinite scroll -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        // ---------- State ----------
        let currentSort = 'timestamp';
        let currentOrder = 'desc';
        let currentSearch = '';
        const perPage = 10;               // rows per page

        // Infinite scroll state
        let currentPage = 1;
        let totalPages = 1;
        let isLoading = false;
        let hasMore = true;

        // DOM elements
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const applyFilter = document.getElementById('applyFilter');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Chart instances
        let cpuChart, memChart, diskChart, networkChart;

        // ---------- Helper: Format timestamp for display (HH:MM:SS) ----------
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ---------- Helper: Compute Y-axis range with padding ----------
        function getAxisRange(data) {
            const minVal = Math.min(...data);
            const maxVal = Math.max(...data);
            const range = maxVal - minVal;
            let padding;
            if (range === 0) {
                padding = 0.5;
            } else {
                padding = range * 0.1; // 10% padding
            }
            return {
                min: minVal - padding,
                max: maxVal + padding
            };
        }

        // ---------- Fetch data for table (with pagination) ----------
        async function fetchTableData(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;
            loadingSpinner.classList.add('visible');

            const params = new URLSearchParams({
                page: page,
                per_page: perPage,
                sort_by: currentSort,
                sort_order: currentOrder,
                search: currentSearch
            });

            try {
                const response = await fetch(`/api/telemetry?${params}`);
                const data = await response.json();

                // Update pagination info
                totalPages = data.total_pages;
                hasMore = page < totalPages;

                if (append) {
                    // Append new rows to existing table body
                    appendRows(data.records);
                } else {
                    // Replace table body with new rows
                    renderTable(data.records);
                }

                // Update current page
                currentPage = page;
            } catch (error) {
                console.error('Failed to fetch table data:', error);
            } finally {
                isLoading = false;
                loadingSpinner.classList.remove('visible');
            }
        }

        // ---------- Render table rows (replaces existing) ----------
        function renderTable(records) {
            if (records.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center">No records found</td></tr>';
                return;
            }

            let html = '';
            records.forEach(record => {
                html += `<tr>
                    <td>${record.timestamp}</td>
                    <td>${record.cpu_util_percent}</td>
                    <td>${record.mem_util_percent}</td>
                    <td>${record.net_in.toFixed(2)}</td>
                    <td>${record.net_out.toFixed(2)}</td>
                    <td>${record.disk_io_percent}</td>
                </tr>`;
            });
            tableBody.innerHTML = html;
        }

        // ---------- Append rows to existing table ----------
        function appendRows(records) {
            if (records.length === 0) return;

            let html = '';
            records.forEach(record => {
                html += `<tr>
                    <td>${record.timestamp}</td>
                    <td>${record.cpu_util_percent}</td>
                    <td>${record.mem_util_percent}</td>
                    <td>${record.net_in.toFixed(2)}</td>
                    <td>${record.net_out.toFixed(2)}</td>
                    <td>${record.disk_io_percent}</td>
                </tr>`;
            });
            tableBody.insertAdjacentHTML('beforeend', html);
        }

        // ---------- Reset table for new search/sort ----------
        function resetAndFetch() {
            // Clear table
            tableBody.innerHTML = '';
            // Reset infinite scroll state
            currentPage = 1;
            hasMore = true;
            // Fetch first page
            fetchTableData(1, false);
        }

        // ---------- Infinite scroll handler ----------
        function handleScroll() {
            if (isLoading || !hasMore) return;

            // Check if user has scrolled near the bottom of the page
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            // Trigger when within 200px of the bottom
            if (scrollY + windowHeight >= documentHeight - 200) {
                // Load next page
                fetchTableData(currentPage + 1, true);
            }
        }

        // ---------- Fetch recent data for charts (last 20 records) ----------
        async function fetchChartData() {
            const params = new URLSearchParams({
                page: 1,
                per_page: 20,
                sort_by: 'timestamp',
                sort_order: 'desc',
                search: ''
            });

            const response = await fetch(`/api/telemetry?${params}`);
            const data = await response.json();
            const records = data.records.reverse(); // oldest first for charts
            updateCharts(records);
        }

        // ---------- Create or update all charts ----------
        function updateCharts(records) {
            const labels = records.map(r => formatTime(r.timestamp));
            const cpuData = records.map(r => r.cpu_util_percent);
            const memData = records.map(r => r.mem_util_percent);
            const diskData = records.map(r => r.disk_io_percent);
            const netInData = records.map(r => r.net_in);
            const netOutData = records.map(r => r.net_out);

            // CPU Chart
            if (cpuChart) {
                cpuChart.data.labels = labels;
                cpuChart.data.datasets[0].data = cpuData;
                const cpuRange = getAxisRange(cpuData);
                cpuChart.options.scales.y.min = cpuRange.min;
                cpuChart.options.scales.y.max = cpuRange.max;
                cpuChart.update();
            } else {
                const ctxCpu = document.getElementById('cpuChart').getContext('2d');
                const cpuRange = getAxisRange(cpuData);
                cpuChart = new Chart(ctxCpu, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'CPU %',
                            data: cpuData,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                min: cpuRange.min,
                                max: cpuRange.max
                            }
                        }
                    }
                });
            }

            // Memory Chart
            if (memChart) {
                memChart.data.labels = labels;
                memChart.data.datasets[0].data = memData;
                const memRange = getAxisRange(memData);
                memChart.options.scales.y.min = memRange.min;
                memChart.options.scales.y.max = memRange.max;
                memChart.update();
            } else {
                const ctxMem = document.getElementById('memChart').getContext('2d');
                const memRange = getAxisRange(memData);
                memChart = new Chart(ctxMem, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Memory %',
                            data: memData,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                min: memRange.min,
                                max: memRange.max
                            }
                        }
                    }
                });
            }

            // Disk Chart
            if (diskChart) {
                diskChart.data.labels = labels;
                diskChart.data.datasets[0].data = diskData;
                const diskRange = getAxisRange(diskData);
                diskChart.options.scales.y.min = diskRange.min;
                diskChart.options.scales.y.max = diskRange.max;
                diskChart.update();
            } else {
                const ctxDisk = document.getElementById('diskChart').getContext('2d');
                const diskRange = getAxisRange(diskData);
                diskChart = new Chart(ctxDisk, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Disk I/O %',
                            data: diskData,
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.1)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                min: diskRange.min,
                                max: diskRange.max
                            }
                        }
                    }
                });
            }

            // Network Chart
            if (networkChart) {
                networkChart.data.labels = labels;
                networkChart.data.datasets[0].data = netInData;
                networkChart.data.datasets[1].data = netOutData;
                networkChart.update();
            } else {
                const ctxNet = document.getElementById('networkChart').getContext('2d');
                networkChart = new Chart(ctxNet, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'In (B/s)',
                                data: netInData,
                                borderColor: 'rgb(153, 102, 255)',
                                backgroundColor: 'rgba(153, 102, 255, 0.1)',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'Out (B/s)',
                                data: netOutData,
                                borderColor: 'rgb(255, 159, 64)',
                                backgroundColor: 'rgba(255, 159, 64, 0.1)',
                                tension: 0.3,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'top' } },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        }

        // ---------- Event Listeners ----------
        document.querySelectorAll('.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const sortBy = th.dataset.sort;
                if (sortBy === currentSort) {
                    currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort = sortBy;
                    currentOrder = 'asc';
                }
                resetAndFetch();
            });
        });

        applyFilter.addEventListener('click', () => {
            currentSearch = searchInput.value.trim();
            resetAndFetch();
        });

        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                applyFilter.click();
            }
        });

        // Infinite scroll listener (throttled with requestAnimationFrame)
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    handleScroll();
                    ticking = false;
                });
                ticking = true;
            }
        });

        // ---------- Real‑time updates ----------
        async function refreshAll() {
            // Refresh charts
            await fetchChartData();
            // Refresh table: we need to reload from page 1, but only if we are not in the middle of loading
            // A simple approach: reset to page 1 only if the user hasn't scrolled far
            // However, to avoid disrupting the user's scroll position, we could just reload the first page
            // and then let infinite scroll load more. But resetting the whole table might be jarring.
            // Instead, we can keep the current page but reload the current set? That's complex.
            // A compromise: if the user is on page 1, we refresh the visible rows; otherwise, we do nothing.
            // But for simplicity, we'll just refresh the first page and clear the table,
            // which might be acceptable for a demo. If you want to preserve scroll position,
            // a more advanced approach is needed.
            // Here we'll reset to page 1 to keep data consistent.
            resetAndFetch();
        }

        // Initial load
        resetAndFetch();
        fetchChartData();

        // Auto‑refresh every 10 seconds
        setInterval(refreshAll, 10000);
    </script>
</body>
</html>
